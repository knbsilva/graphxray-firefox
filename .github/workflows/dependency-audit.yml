name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run production dependency audit
        run: |
          npm run audit:prod:json > npm-audit-report.json || true

      - name: Summarize audit report
        run: |
          node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync('npm-audit-report.json','utf8'));const vulns=report.metadata?.vulnerabilities||{};console.log('critical:', vulns.critical||0);console.log('high:', vulns.high||0);console.log('moderate:', vulns.moderate||0);console.log('low:', vulns.low||0);"

      - name: Upload audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-report
          path: npm-audit-report.json
