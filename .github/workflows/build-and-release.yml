name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.get_version.outputs.current_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false --runInBand

      - name: Validate Firefox build and package
        run: npm run package

      - name: Get build version
        id: get_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Upload validated release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox-packages-${{ steps.get_version.outputs.current_version }}
          path: |
            build/packages/graphxray-firefox-v${{ steps.get_version.outputs.current_version }}.zip
            build/packages/graphxray-firefox-unsigned-v${{ steps.get_version.outputs.current_version }}.xpi

      - name: Output build information
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"
          echo "✅ Build completed successfully!"
          echo "📦 Version: $CURRENT_VERSION"
          echo "🏗️ Firefox unpacked build: build/firefox/"
          echo "📁 Packaged artifacts: build/packages/"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ℹ️ Manual release workflow is enabled for this run."
          else
            echo "ℹ️ Validation-only run. No release was created."
          fi

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download validated release packages
        uses: actions/download-artifact@95815c38cf689c6ac94f1f98287bbf6f9e1eac6c # v4.2.1
        with:
          name: firefox-packages-${{ needs.build.outputs.current_version }}
          path: build/packages

      - name: Show release artifact contents
        run: ls -R build/packages

      - name: Create Release
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build.outputs.current_version }}
          release_name: Graph X-Ray Firefox v${{ needs.build.outputs.current_version }}
          body: |
            ## Graph X-Ray Firefox v${{ needs.build.outputs.current_version }}

            ### Changes
            - Manual release from commit ${{ github.sha }}

            ### Installation
            - Firefox development:
              - Download `graphxray-firefox-v${{ needs.build.outputs.current_version }}.zip`
              - Extract the archive, open `about:debugging#/runtime/this-firefox`, and load the included `manifest.json` as a temporary add-on
            - Firefox installation:
              - `graphxray-firefox-unsigned-v${{ needs.build.outputs.current_version }}.xpi` is unsigned and must be signed by Mozilla before standard Firefox installation

          draft: false
          prerelease: false

      - name: Upload Firefox Zip Release Asset
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/packages/graphxray-firefox-v${{ needs.build.outputs.current_version }}.zip
          asset_name: graphxray-firefox-v${{ needs.build.outputs.current_version }}.zip
          asset_content_type: application/zip

      - name: Upload Firefox XPI Release Asset
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/packages/graphxray-firefox-unsigned-v${{ needs.build.outputs.current_version }}.xpi
          asset_name: graphxray-firefox-unsigned-v${{ needs.build.outputs.current_version }}.xpi
          asset_content_type: application/x-xpinstall
