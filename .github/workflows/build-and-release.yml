name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Firefox build and package
        run: npm run package

      - name: Output build information
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "✅ Build completed successfully!"
          echo "📦 Version: $CURRENT_VERSION"
          echo "🏗️ Firefox unpacked build: build/firefox/"
          echo "📁 Packaged artifacts: build/packages/"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ℹ️ Manual release workflow is enabled for this run."
          else
            echo "ℹ️ Validation-only run. No release was created."
          fi

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package release artifacts
        run: npm run package

      - name: Get release version
        id: get_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.current_version }}
          release_name: Graph X-Ray Firefox v${{ steps.get_version.outputs.current_version }}
          body: |
            ## Graph X-Ray Firefox v${{ steps.get_version.outputs.current_version }}

            ### Changes
            - Manual release from commit ${{ github.sha }}

            ### Installation
            - Firefox development:
              - Download `graphxray-firefox-v${{ steps.get_version.outputs.current_version }}.zip`
              - Extract the archive, open `about:debugging#/runtime/this-firefox`, and load the included `manifest.json` as a temporary add-on
            - Firefox installation:
              - `graphxray-firefox-unsigned-v${{ steps.get_version.outputs.current_version }}.xpi` is unsigned and must be signed by Mozilla before standard Firefox installation

          draft: false
          prerelease: false

      - name: Upload Firefox Zip Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/packages/graphxray-firefox-v${{ steps.get_version.outputs.current_version }}.zip
          asset_name: graphxray-firefox-v${{ steps.get_version.outputs.current_version }}.zip
          asset_content_type: application/zip

      - name: Upload Firefox XPI Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/packages/graphxray-firefox-unsigned-v${{ steps.get_version.outputs.current_version }}.xpi
          asset_name: graphxray-firefox-unsigned-v${{ steps.get_version.outputs.current_version }}.xpi
          asset_content_type: application/x-xpinstall
